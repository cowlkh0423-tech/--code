<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE : 죽림고수</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020805;
    font-family: Georgia, "Noto Serif KR", serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

#title {
    position: absolute;
    top: 22px;
    left: 28px;
    color: rgba(225, 194, 100, 0.8);
    font-size: 18px;
    letter-spacing: 6px;
}

#heart {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #dfc56d;
    font-size: 28px;
    text-shadow: 0 0 15px rgba(230, 190, 70, 0.7);
}

#time {
    position: absolute;
    top: 23px;
    right: 28px;
    color: rgba(240, 225, 180, 0.8);
    font-family: monospace;
    font-size: 17px;
}

.screen {
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(500px, 88vw);
    padding: 45px 30px;
    text-align: center;
    background: rgba(2, 12, 7, 0.88);
    border: 1px solid rgba(220, 185, 80, 0.3);
    box-shadow: 0 0 80px rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
}

.hidden {
    display: none !important;
}

.small-title {
    color: rgba(220, 190, 100, 0.65);
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 12px;
}

h1 {
    color: #dfc36c;
    font-size: clamp(55px, 13vw, 100px);
    letter-spacing: 12px;
    text-shadow: 0 0 35px rgba(220,180,70,0.25);
}

h2 {
    color: #e5d9a9;
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 8px;
}

.info {
    margin-top: 25px;
    color: rgba(230,230,210,0.7);
    line-height: 1.9;
}

.controls {
    margin-top: 18px;
    color: rgba(220,195,120,0.65);
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
}

button {
    margin-top: 28px;
    padding: 13px 35px;
    background: rgba(200,165,70,0.07);
    border: 1px solid rgba(220,190,100,0.55);
    color: #e4c96f;
    font-family: Georgia, serif;
    letter-spacing: 3px;
    cursor: pointer;
}

button:hover {
    background: rgba(220,180,70,0.16);
    box-shadow: 0 0 25px rgba(220,180,70,0.18);
}

#finalTime {
    margin-top: 20px;
    font-family: monospace;
    font-size: 40px;
    color: #e4c96f;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">CODE</div>
    <div id="heart">♥</div>
    <div id="time">0.00</div>
</div>

<div id="startScreen" class="screen">

    <div class="small-title">BAMBOO SURVIVAL</div>

    <h1>CODE</h1>

    <h2>죽림고수</h2>

    <div class="info">
        날아오는 화살을 피해<br>
        최대한 오래 살아남아라.
    </div>

    <div class="controls">
        WASD / 방향키 이동
    </div>

    <button id="startButton">
        GAME START
    </button>

</div>

<div id="gameOverScreen" class="screen hidden">

    <div class="small-title">SURVIVAL ENDED</div>

    <h2>GAME OVER</h2>

    <div id="finalTime">0.00</div>

    <button id="restartButton">
        RESTART
    </button>

    <div class="controls">
        R 키로 재시작
    </div>

</div>


<script>

"use strict";

/* ============================================================
   기본
============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const timeText = document.getElementById("time");
const finalTime = document.getElementById("finalTime");


/* ============================================================
   화면 크기
============================================================ */

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* ============================================================
   키보드
============================================================ */

const keys = {};

window.addEventListener("keydown", function(e) {

    const key = e.key.toLowerCase();

    keys[key] = true;

    if (
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {
        e.preventDefault();
    }

    if (key === "r" && !game.running) {
        startGame();
    }

});

window.addEventListener("keyup", function(e) {

    keys[e.key.toLowerCase()] = false;

});


/* ============================================================
   게임 상태
============================================================ */

const game = {

    running: false,

    startTime: 0,

    lastTime: 0,

    elapsed: 0,

    arrowTimer: 0,

    arrows: []

};


/* ============================================================
   플레이어
============================================================ */

const player = {

    x: 0,

    y: 0,

    radius: 13,

    speed: 330,

    reset() {

        this.x = canvas.width / 2;
        this.y = canvas.height / 2;

    },

    update(dt) {

        let x = 0;
        let y = 0;

        if (keys["w"] || keys["arrowup"]) {
            y -= 1;
        }

        if (keys["s"] || keys["arrowdown"]) {
            y += 1;
        }

        if (keys["a"] || keys["arrowleft"]) {
            x -= 1;
        }

        if (keys["d"] || keys["arrowright"]) {
            x += 1;
        }

        if (x !== 0 || y !== 0) {

            const length = Math.sqrt(
                x * x + y * y
            );

            x /= length;
            y /= length;

        }

        this.x += x * this.speed * dt;
        this.y += y * this.speed * dt;

        this.x = Math.max(
            this.radius,
            Math.min(
                canvas.width - this.radius,
                this.x
            )
        );

        this.y = Math.max(
            this.radius,
            Math.min(
                canvas.height - this.radius,
                this.y
            )
        );

    },

    draw() {

        ctx.save();

        ctx.translate(this.x, this.y);

        /* 외부 빛 */

        ctx.shadowColor = "rgba(240,205,100,0.8)";
        ctx.shadowBlur = 20;

        /* 외곽 */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#e0c36a";
        ctx.fill();

        /* 내부 */

        ctx.shadowBlur = 0;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#07150b";
        ctx.fill();

        /* 중심 */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#fff0a0";
        ctx.fill();

        ctx.restore();

    }

};


/* ============================================================
   화살
============================================================ */

class Arrow {

    constructor(x, y, angle, speed) {

        this.x = x;
        this.y = y;

        this.angle = angle;
        this.speed = speed;

        this.length = 42;

        this.active = true;

    }

    update(dt) {

        this.x +=
            Math.cos(this.angle) *
            this.speed *
            dt;

        this.y +=
            Math.sin(this.angle) *
            this.speed *
            dt;

    }

    isOutside() {

        const margin = 100;

        return (
            this.x < -margin ||
            this.x > canvas.width + margin ||
            this.y < -margin ||
            this.y > canvas.height + margin
        );

    }

    collides() {

        const dx = this.x - player.x;
        const dy = this.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        return distance < 23;

    }

    draw() {

        ctx.save();

        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        /* ====================================================
           화살 잔상
        ==================================================== */

        const trail =
            ctx.createLinearGradient(
                -65,
                0,
                5,
                0
            );

        trail.addColorStop(
            0,
            "rgba(210,170,70,0)"
        );

        trail.addColorStop(
            1,
            "rgba(240,210,110,0.32)"
        );

        ctx.fillStyle = trail;

        ctx.fillRect(
            -65,
            -1,
            65,
            2
        );


        /* ====================================================
           화살대
        ==================================================== */

        const shaft =
            ctx.createLinearGradient(
                -22,
                -2,
                20,
                2
            );

        shaft.addColorStop(
            0,
            "#76531e"
        );

        shaft.addColorStop(
            0.45,
            "#e7cb72"
        );

        shaft.addColorStop(
            0.75,
            "#fff0aa"
        );

        shaft.addColorStop(
            1,
            "#98702b"
        );

        ctx.fillStyle = shaft;

        ctx.fillRect(
            -22,
            -2,
            38,
            4
        );


        /* ====================================================
           화살촉
        ==================================================== */

        ctx.shadowColor =
            "rgba(240,205,100,0.75)";

        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.moveTo(27, 0);

        ctx.lineTo(10, -9);

        ctx.lineTo(14, 0);

        ctx.lineTo(10, 9);

        ctx.closePath();

        const head =
            ctx.createLinearGradient(
                8,
                -10,
                28,
                10
            );

        head.addColorStop(
            0,
            "#fff3b5"
        );

        head.addColorStop(
            0.45,
            "#dfbd57"
        );

        head.addColorStop(
            1,
            "#80601e"
        );

        ctx.fillStyle = head;
        ctx.fill();


        /* ====================================================
           화살 꼬리
        ==================================================== */

        ctx.shadowBlur = 0;

        ctx.beginPath();

        ctx.moveTo(-21, 0);

        ctx.lineTo(-32, -7);

        ctx.lineTo(-27, 0);

        ctx.lineTo(-32, 7);

        ctx.closePath();

        ctx.fillStyle = "#a98235";

        ctx.fill();


        /* 하이라이트 */

        ctx.fillStyle =
            "rgba(255,250,210,0.8)";

        ctx.fillRect(
            -14,
            -0.8,
            20,
            1.6
        );

        ctx.restore();

    }

}


/* ============================================================
   화살 생성
============================================================ */

function addArrow(
    x,
    y,
    angle,
    speed
) {

    game.arrows.push(
        new Arrow(
            x,
            y,
            angle,
            speed
        )
    );

}


/* ============================================================
   화면 가장자리 위치
============================================================ */

function edgePosition() {

    const side =
        Math.floor(Math.random() * 4);

    const margin = 70;

    if (side === 0) {

        return {
            x: Math.random() * canvas.width,
            y: -margin
        };

    }

    if (side === 1) {

        return {
            x: canvas.width + margin,
            y: Math.random() * canvas.height
        };

    }

    if (side === 2) {

        return {
            x: Math.random() * canvas.width,
            y: canvas.height + margin
        };

    }

    return {
        x: -margin,
        y: Math.random() * canvas.height
    };

}


/* ============================================================
   플레이어를 향하는 방향
============================================================ */

function angleToPlayer(x, y) {

    return Math.atan2(
        player.y - y,
        player.x - x
    );

}


/* ============================================================
   패턴 1
   원작 느낌의 단발 화살
============================================================ */

function patternSingle() {

    const p = edgePosition();

    addArrow(
        p.x,
        p.y,
        angleToPlayer(p.x, p.y),
        390 + game.elapsed * 4
    );

}


/* ============================================================
   패턴 2
   일정한 간격의 일렬 화살
============================================================ */

function patternLine() {

    const side =
        Math.floor(Math.random() * 4);

    const speed =
        410 + game.elapsed * 4;

    const count = 4;

    const gap = 90;

    if (side === 0) {

        const startX =
            Math.random() * canvas.width;

        for (let i = 0; i < count; i++) {

            addArrow(
                startX + (i - 1.5) * gap,
                -70,
                Math.PI / 2,
                speed
            );

        }

    }

    else if (side === 1) {

        const startY =
            Math.random() * canvas.height;

        for (let i = 0; i < count; i++) {

            addArrow(
                canvas.width + 70,
                startY + (i - 1.5) * gap,
                Math.PI,
                speed
            );

        }

    }

    else if (side === 2) {

        const startX =
            Math.random() * canvas.width;

        for (let i = 0; i < count; i++) {

            addArrow(
                startX + (i - 1.5) * gap,
                canvas.height + 70,
                -Math.PI / 2,
                speed
            );

        }

    }

    else {

        const startY =
            Math.random() * canvas.height;

        for (let i = 0; i < count; i++) {

            addArrow(
                -70,
                startY + (i - 1.5) * gap,
                0,
                speed
            );

        }

    }

}


/* ============================================================
   패턴 3
   대각선
============================================================ */

function patternDiagonal() {

    const speed =
        430 + game.elapsed * 4;

    const margin = 70;

    const corner =
        Math.floor(Math.random() * 4);

    if (corner === 0) {

        addArrow(
            -margin,
            -margin,
            Math.PI / 4,
            speed
        );

    }

    else if (corner === 1) {

        addArrow(
            canvas.width + margin,
            -margin,
            3 * Math.PI / 4,
            speed
        );

    }

    else if (corner === 2) {

        addArrow(
            canvas.width + margin,
            canvas.height + margin,
            5 * Math.PI / 4,
            speed
        );

    }

    else {

        addArrow(
            -margin,
            canvas.height + margin,
            7 * Math.PI / 4,
            speed
        );

    }

}


/* ============================================================
   패턴 4
   부채꼴
============================================================ */

function patternFan() {

    const side =
        Math.floor(Math.random() * 4);

    const count = 5;

    const spread = Math.PI / 14;

    const speed =
        400 + game.elapsed * 4;

    let x;
    let y;
    let base;

    if (side === 0) {

        x = Math.random() * canvas.width;
        y = -70;
        base = Math.PI / 2;

    }

    else if (side === 1) {

        x = canvas.width + 70;
        y = Math.random() * canvas.height;
        base = Math.PI;

    }

    else if (side === 2) {

        x = Math.random() * canvas.width;
        y = canvas.height + 70;
        base = -Math.PI / 2;

    }

    else {

        x = -70;
        y = Math.random() * canvas.height;
        base = 0;

    }

    for (let i = 0; i < count; i++) {

        const angle =
            base +
            (i - 2) * spread;

        addArrow(
            x,
            y,
            angle,
            speed
        );

    }

}


/* ============================================================
   패턴 5
   반대편에서 동시에
============================================================ */

function patternOpposite() {

    const y =
        100 +
        Math.random() *
        (canvas.height - 200);

    const speed =
        420 + game.elapsed * 4;

    addArrow(
        -70,
        y,
        0,
        speed
    );

    addArrow(
        canvas.width + 70,
        y,
        Math.PI,
        speed
    );

}


/* ============================================================
   패턴 선택
============================================================ */

function createPattern() {

    const t = game.elapsed;

    if (t < 3) {

        patternSingle();

        return;

    }

    if (t < 7) {

        const patterns = [
            patternSingle,
            patternLine,
            patternDiagonal
        ];

        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ]();

        return;

    }

    if (t < 12) {

        const patterns = [
            patternLine,
            patternDiagonal,
            patternFan,
            patternOpposite
        ];

        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ]();

        return;

    }

    const patterns = [
        patternSingle,
        patternLine,
        patternDiagonal,
        patternFan,
        patternOpposite
    ];

    patterns[
        Math.floor(
            Math.random() *
            patterns.length
        )
    ]();

}


/* ============================================================
   난이도
============================================================ */

function patternInterval() {

    if (game.elapsed < 3) {
        return 0.9;
    }

    if (game.elapsed < 7) {
        return 0.72;
    }

    if (game.elapsed < 12) {
        return 0.58;
    }

    if (game.elapsed < 20) {
        return 0.48;
    }

    return 0.4;

}


/* ============================================================
   게임 시작
============================================================ */

function startGame() {

    game.running = true;

    game.elapsed = 0;

    game.arrows = [];

    game.arrowTimer = 0.8;

    game.startTime =
        performance.now();

    game.lastTime =
        performance.now();

    player.reset();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    requestAnimationFrame(loop);

}


/* ============================================================
   게임 오버
============================================================ */

function gameOver() {

    if (!game.running) {
        return;
    }

    game.running = false;

    finalTime.textContent =
        game.elapsed.toFixed(2);

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* ============================================================
   업데이트
============================================================ */

function update(dt) {

    game.elapsed =
        (
            performance.now() -
            game.startTime
        ) / 1000;

    player.update(dt);

    game.arrowTimer -= dt;

    if (game.arrowTimer <= 0) {

        createPattern();

        game.arrowTimer =
            patternInterval();

    }


    for (const arrow of game.arrows) {

        arrow.update(dt);

        if (arrow.collides()) {

            gameOver();

            return;

        }

        if (arrow.isOutside()) {

            arrow.active = false;

        }

    }


    game.arrows =
        game.arrows.filter(
            arrow => arrow.active
        );

}


/* ============================================================
   배경
============================================================ */

function drawBackground() {

    const w = canvas.width;
    const h = canvas.height;


    /* 전체 배경 */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            h
        );

    bg.addColorStop(
        0,
        "#020806"
    );

    bg.addColorStop(
        0.5,
        "#092014"
    );

    bg.addColorStop(
        1,
        "#010402"
    );

    ctx.fillStyle = bg;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* 뒤쪽 대나무 */

    drawBamboo(
        80,
        0.65,
        0.35
    );


    /* CODE */

    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font =
        "bold " +
        Math.min(
            w * 0.15,
            150
        ) +
        "px Georgia";

    ctx.fillStyle =
        "rgba(220,185,75,0.055)";

    ctx.shadowColor =
        "rgba(220,185,75,0.15)";

    ctx.shadowBlur = 35;

    ctx.fillText(
        "CODE",
        w / 2,
        h / 2
    );

    ctx.restore();


    /* 앞쪽 대나무 */

    drawBamboo(
        125,
        1,
        0.65
    );


    /* 어두운 가장자리 */

    const vignette =
        ctx.createRadialGradient(
            w / 2,
            h / 2,
            h * 0.2,
            w / 2,
            h / 2,
            w * 0.75
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,0.5)"
    );

    ctx.fillStyle = vignette;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );

}


/* ============================================================
   대나무
============================================================ */

function drawBamboo(
    spacing,
    scale,
    alpha
) {

    for (
        let x = -60;
        x < canvas.width + 100;
        x += spacing
    ) {

        const sway =
            Math.sin(x * 0.03) * 8;

        const width =
            16 * scale;


        const bamboo =
            ctx.createLinearGradient(
                x,
                0,
                x + width,
                0
            );

        bamboo.addColorStop(
            0,
            `rgba(4,20,9,${alpha})`
        );

        bamboo.addColorStop(
            0.4,
            `rgba(45,85,42,${alpha})`
        );

        bamboo.addColorStop(
            0.65,
            `rgba(60,105,52,${alpha})`
        );

        bamboo.addColorStop(
            1,
            `rgba(5,25,10,${alpha})`
        );

        ctx.fillStyle = bamboo;

        ctx.fillRect(
            x + sway,
            0,
            width,
            canvas.height
        );


        /* 대나무 마디 */

        ctx.fillStyle =
            `rgba(4,18,7,${alpha})`;

        for (
            let y = 50;
            y < canvas.height;
            y += 72
        ) {

            ctx.fillRect(
                x + sway - 2,
                y,
                width + 4,
                5
            );

        }

    }

}


/* ============================================================
   렌더링
============================================================ */

function draw() {

    drawBackground();

    for (const arrow of game.arrows) {

        arrow.draw();

    }

    player.draw();

    timeText.textContent =
        game.elapsed.toFixed(2);

}


/* ============================================================
   게임 루프
============================================================ */

function loop(now) {

    if (!game.running) {
        return;
    }

    const dt =
        Math.min(
            (now - game.lastTime) / 1000,
            0.05
        );

    game.lastTime = now;

    update(dt);

    draw();

    requestAnimationFrame(loop);

}


/* ============================================================
   버튼
============================================================ */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);


/* ============================================================
   초기 화면
============================================================ */

player.reset();

draw();

</script>
