<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE : 죽림고수</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020805;
    font-family:Georgia,"Noto Serif KR",serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#title{
    position:absolute;
    top:22px;
    left:28px;
    color:rgba(225,194,100,.8);
    font-size:18px;
    letter-spacing:6px;
}

#heart{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    color:#dfc56d;
    font-size:28px;
    text-shadow:0 0 15px rgba(230,190,70,.7);
}

#time{
    position:absolute;
    top:23px;
    right:28px;
    color:rgba(240,225,180,.8);
    font-family:monospace;
    font-size:17px;
}

.screen{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(500px,88vw);
    padding:45px 30px;
    text-align:center;
    background:rgba(2,12,7,.9);
    border:1px solid rgba(220,185,80,.3);
    box-shadow:0 0 80px rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
}

.hidden{
    display:none!important;
}

.small-title{
    color:rgba(220,190,100,.65);
    font-size:11px;
    letter-spacing:5px;
    margin-bottom:12px;
}

h1{
    color:#dfc36c;
    font-size:clamp(55px,13vw,100px);
    letter-spacing:12px;
    text-shadow:0 0 35px rgba(220,180,70,.25);
}

h2{
    color:#e5d9a9;
    font-size:22px;
    font-weight:normal;
    letter-spacing:8px;
}

.info{
    margin-top:25px;
    color:rgba(230,230,210,.7);
    line-height:1.9;
}

.controls{
    margin-top:18px;
    color:rgba(220,195,120,.65);
    font-family:monospace;
    font-size:12px;
    letter-spacing:2px;
}

button{
    margin-top:28px;
    padding:13px 35px;
    background:rgba(200,165,70,.07);
    border:1px solid rgba(220,190,100,.55);
    color:#e4c96f;
    font-family:Georgia,serif;
    letter-spacing:3px;
    cursor:pointer;
}

button:hover{
    background:rgba(220,180,70,.16);
    box-shadow:0 0 25px rgba(220,180,70,.18);
}

#finalTime{
    margin-top:20px;
    font-family:monospace;
    font-size:40px;
    color:#e4c96f;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">CODE</div>
    <div id="heart">♥</div>
    <div id="time">0.00</div>
</div>

<div id="startScreen" class="screen">

    <div class="small-title">BAMBOO SURVIVAL</div>

    <h1>CODE</h1>

    <h2>죽림고수</h2>

    <div class="info">
        날아오는 화살을 피해<br>
        최대한 오래 살아남아라.
    </div>

    <div class="controls">
        WASD / 방향키 이동
    </div>

    <button id="startButton">
        GAME START
    </button>

</div>

<div id="gameOverScreen" class="screen hidden">

    <div class="small-title">SURVIVAL ENDED</div>

    <h2>GAME OVER</h2>

    <div id="finalTime">0.00</div>

    <button id="restartButton">
        RESTART
    </button>

    <div class="controls">
        R 키로 재시작
    </div>

</div>


<script>

"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const startScreen=document.getElementById("startScreen");
const gameOverScreen=document.getElementById("gameOverScreen");

const startButton=document.getElementById("startButton");
const restartButton=document.getElementById("restartButton");

const timeText=document.getElementById("time");
const finalTime=document.getElementById("finalTime");


/* ============================================================
   화면
============================================================ */

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


/* ============================================================
   키보드
============================================================ */

const keys={};

window.addEventListener("keydown",function(e){

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(
        key==="arrowup"||
        key==="arrowdown"||
        key==="arrowleft"||
        key==="arrowright"
    ){
        e.preventDefault();
    }

    if(key==="r"&&!game.running){
        startGame();
    }

});

window.addEventListener("keyup",function(e){
    keys[e.key.toLowerCase()]=false;
});


/* ============================================================
   게임
============================================================ */

const game={

    running:false,

    startTime:0,

    lastTime:0,

    elapsed:0,

    arrowTimer:0,

    arrows:[]

};


/* ============================================================
   플레이어
============================================================ */

const player={

    x:0,
    y:0,

    radius:17,

    speed:360,

    reset(){

        this.x=canvas.width/2;
        this.y=canvas.height/2;

    },

    update(dt){

        let x=0;
        let y=0;

        if(keys["w"]||keys["arrowup"]) y-=1;
        if(keys["s"]||keys["arrowdown"]) y+=1;
        if(keys["a"]||keys["arrowleft"]) x-=1;
        if(keys["d"]||keys["arrowright"]) x+=1;

        if(x!==0||y!==0){

            const length=Math.sqrt(x*x+y*y);

            x/=length;
            y/=length;

        }

        this.x+=x*this.speed*dt;
        this.y+=y*this.speed*dt;

        this.x=Math.max(
            this.radius,
            Math.min(canvas.width-this.radius,this.x)
        );

        this.y=Math.max(
            this.radius,
            Math.min(canvas.height-this.radius,this.y)
        );

    },

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);

        /* 그림자 */

        ctx.beginPath();

        ctx.ellipse(
            0,
            15,
            13,
            5,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle="rgba(0,0,0,.5)";
        ctx.fill();


        /* 망토 */

        ctx.beginPath();

        ctx.moveTo(-10,-2);
        ctx.lineTo(-13,16);
        ctx.lineTo(13,16);
        ctx.lineTo(10,-2);
        ctx.closePath();

        const robe=ctx.createLinearGradient(
            -12,
            0,
            12,
            0
        );

        robe.addColorStop(0,"#151b18");
        robe.addColorStop(.5,"#59604d");
        robe.addColorStop(1,"#111611");

        ctx.fillStyle=robe;
        ctx.fill();


        /* 몸 */

        ctx.beginPath();

        ctx.moveTo(-7,-4);
        ctx.lineTo(-8,11);
        ctx.lineTo(8,11);
        ctx.lineTo(7,-4);
        ctx.closePath();

        ctx.fillStyle="#252b26";
        ctx.fill();


        /* 왼팔 */

        ctx.beginPath();

        ctx.moveTo(-6,-3);
        ctx.lineTo(-14,7);
        ctx.lineTo(-11,9);
        ctx.lineTo(-3,1);
        ctx.closePath();

        ctx.fillStyle="#343a31";
        ctx.fill();


        /* 오른팔 */

        ctx.beginPath();

        ctx.moveTo(6,-3);
        ctx.lineTo(14,7);
        ctx.lineTo(11,9);
        ctx.lineTo(3,1);
        ctx.closePath();

        ctx.fillStyle="#343a31";
        ctx.fill();


        /* 목 */

        ctx.fillStyle="#c9a87a";

        ctx.fillRect(
            -3,
            -7,
            6,
            5
        );


        /* 머리 */

        ctx.beginPath();

        ctx.arc(
            0,
            -12,
            7,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#c9a87a";
        ctx.fill();


        /* 머리카락 */

        ctx.beginPath();

        ctx.arc(
            0,
            -15,
            7,
            Math.PI,
            Math.PI*2
        );

        ctx.fillStyle="#10130f";
        ctx.fill();


        /* 상투 */

        ctx.beginPath();

        ctx.arc(
            0,
            -21,
            3,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#0b0d0b";
        ctx.fill();


        /* 허리띠 */

        ctx.fillStyle="#c8a84f";

        ctx.fillRect(
            -7,
            4,
            14,
            2
        );


        /* 검 */

        ctx.save();

        ctx.rotate(.25);

        ctx.fillStyle="#8d7138";

        ctx.fillRect(
            8,
            1,
            12,
            2
        );

        ctx.fillStyle="#e1d5a4";

        ctx.fillRect(
            18,
            .5,
            8,
            3
        );

        ctx.restore();


        /* 은은한 외곽 빛 */

        ctx.shadowColor="rgba(220,190,90,.45)";
        ctx.shadowBlur=12;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            18,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="rgba(220,190,90,.18)";
        ctx.stroke();

        ctx.restore();

    }

};


/* ============================================================
   화살
============================================================ */

class Arrow{

    constructor(x,y,angle,speed){

        this.x=x;
        this.y=y;

        this.angle=angle;

        this.speed=speed;

        this.length=58;

        this.active=true;

    }

    update(dt){

        this.x+=
            Math.cos(this.angle)*
            this.speed*
            dt;

        this.y+=
            Math.sin(this.angle)*
            this.speed*
            dt;

    }

    isOutside(){

        const margin=130;

        return(
            this.x<-margin||
            this.x>canvas.width+margin||
            this.y<-margin||
            this.y>canvas.height+margin
        );

    }

    collides(){

        const dx=this.x-player.x;
        const dy=this.y-player.y;

        const distance=Math.sqrt(
            dx*dx+dy*dy
        );

        return distance<25;

    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);
        ctx.rotate(this.angle);


        /* ====================================================
           긴 잔상
        ==================================================== */

        const trail=ctx.createLinearGradient(
            -100,
            0,
            5,
            0
        );

        trail.addColorStop(
            0,
            "rgba(230,190,70,0)"
        );

        trail.addColorStop(
            .7,
            "rgba(230,190,70,.08)"
        );

        trail.addColorStop(
            1,
            "rgba(255,225,120,.38)"
        );

        ctx.fillStyle=trail;

        ctx.fillRect(
            -100,
            -1,
            100,
            2
        );


        /* ====================================================
           화살대
        ==================================================== */

        const shaft=ctx.createLinearGradient(
            -32,
            -2,
            30,
            2
        );

        shaft.addColorStop(
            0,
            "#604313"
        );

        shaft.addColorStop(
            .35,
            "#b98c36"
        );

        shaft.addColorStop(
            .65,
            "#fff0a0"
        );

        shaft.addColorStop(
            1,
            "#805d1c"
        );

        ctx.fillStyle=shaft;

        ctx.fillRect(
            -35,
            -1.7,
            67,
            3.4
        );


        /* ====================================================
           날카로운 화살촉
        ==================================================== */

        ctx.shadowColor=
            "rgba(255,220,100,.9)";

        ctx.shadowBlur=14;

        ctx.beginPath();

        /* 뾰족한 끝 */

        ctx.moveTo(48,0);

        /* 위쪽 */

        ctx.lineTo(17,-7);

        /* 안쪽 */

        ctx.lineTo(23,-1.5);

        /* 아래쪽 */

        ctx.lineTo(17,7);

        ctx.closePath();

        const head=ctx.createLinearGradient(
            15,
            -8,
            50,
            8
        );

        head.addColorStop(
            0,
            "#fff5bd"
        );

        head.addColorStop(
            .35,
            "#e6c967"
        );

        head.addColorStop(
            .75,
            "#a77a25"
        );

        head.addColorStop(
            1,
            "#fff1a0"
        );

        ctx.fillStyle=head;
        ctx.fill();


        /* 화살촉 중앙 */

        ctx.shadowBlur=0;

        ctx.beginPath();

        ctx.moveTo(48,0);
        ctx.lineTo(22,-1.3);
        ctx.lineTo(22,1.3);

        ctx.closePath();

        ctx.fillStyle="#fff7cc";
        ctx.fill();


        /* ====================================================
           꼬리 깃털
        ==================================================== */

        ctx.beginPath();

        ctx.moveTo(-34,0);

        ctx.lineTo(-47,-8);

        ctx.lineTo(-42,0);

        ctx.lineTo(-47,8);

        ctx.closePath();

        ctx.fillStyle="#9b762d";
        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(-35,-1);

        ctx.lineTo(-46,-5);

        ctx.lineTo(-42,-1);

        ctx.closePath();

        ctx.fillStyle="#e4c875";
        ctx.fill();


        /* 하이라이트 */

        ctx.fillStyle=
            "rgba(255,255,220,.85)";

        ctx.fillRect(
            -27,
            -.6,
            43,
            1.2
        );

        ctx.restore();

    }

}


/* ============================================================
   화살 생성
============================================================ */

function addArrow(x,y,angle,speed){

    game.arrows.push(
        new Arrow(
            x,
            y,
            angle,
            speed
        )
    );

}


/* ============================================================
   가장자리
============================================================ */

function edgePosition(){

    const side=
        Math.floor(Math.random()*4);

    const margin=90;

    if(side===0){

        return{
            x:Math.random()*canvas.width,
            y:-margin
        };

    }

    if(side===1){

        return{
            x:canvas.width+margin,
            y:Math.random()*canvas.height
        };

    }

    if(side===2){

        return{
            x:Math.random()*canvas.width,
            y:canvas.height+margin
        };

    }

    return{
        x:-margin,
        y:Math.random()*canvas.height
    };

}


function angleToPlayer(x,y){

    return Math.atan2(
        player.y-y,
        player.x-x
    );

}


/* ============================================================
   패턴
============================================================ */

function patternSingle(){

    const p=edgePosition();

    addArrow(
        p.x,
        p.y,
        angleToPlayer(p.x,p.y),
        500+game.elapsed*5
    );

}


function patternLine(){

    const side=
        Math.floor(Math.random()*4);

    const speed=
        520+game.elapsed*5;

    const count=4;
    const gap=105;

    if(side===0){

        const x=Math.random()*canvas.width;

        for(let i=0;i<count;i++){

            addArrow(
                x+(i-1.5)*gap,
                -90,
                Math.PI/2,
                speed
            );

        }

    }

    else if(side===1){

        const y=Math.random()*canvas.height;

        for(let i=0;i<count;i++){

            addArrow(
                canvas.width+90,
                y+(i-1.5)*gap,
                Math.PI,
                speed
            );

        }

    }

    else if(side===2){

        const x=Math.random()*canvas.width;

        for(let i=0;i<count;i++){

            addArrow(
                x+(i-1.5)*gap,
                canvas.height+90,
                -Math.PI/2,
                speed
            );

        }

    }

    else{

        const y=Math.random()*canvas.height;

        for(let i=0;i<count;i++){

            addArrow(
                -90,
                y+(i-1.5)*gap,
                0,
                speed
            );

        }

    }

}


function patternDiagonal(){

    const speed=
        540+game.elapsed*5;

    const margin=90;

    const corner=
        Math.floor(Math.random()*4);

    if(corner===0){

        addArrow(
            -margin,
            -margin,
            Math.PI/4,
            speed
        );

    }

    else if(corner===1){

        addArrow(
            canvas.width+margin,
            -margin,
            3*Math.PI/4,
            speed
        );

    }

    else if(corner===2){

        addArrow(
            canvas.width+margin,
            canvas.height+margin,
            5*Math.PI/4,
            speed
        );

    }

    else{

        addArrow(
            -margin,
            canvas.height+margin,
            7*Math.PI/4,
            speed
        );

    }

}


function patternFan(){

    const side=
        Math.floor(Math.random()*4);

    const count=5;

    const spread=Math.PI/13;

    const speed=
        510+game.elapsed*5;

    let x,y,base;

    if(side===0){

        x=Math.random()*canvas.width;
        y=-90;
        base=Math.PI/2;

    }

    else if(side===1){

        x=canvas.width+90;
        y=Math.random()*canvas.height;
        base=Math.PI;

    }

    else if(side===2){

        x=Math.random()*canvas.width;
        y=canvas.height+90;
        base=-Math.PI/2;

    }

    else{

        x=-90;
        y=Math.random()*canvas.height;
        base=0;

    }

    for(let i=0;i<count;i++){

        const angle=
            base+(i-2)*spread;

        addArrow(
            x,
            y,
            angle,
            speed
        );

    }

}


function patternOpposite(){

    const y=
        100+
        Math.random()*
        (canvas.height-200);

    const speed=
        530+game.elapsed*5;

    addArrow(
        -90,
        y,
        0,
        speed
    );

    addArrow(
        canvas.width+90,
        y,
        Math.PI,
        speed
    );

}


/* ============================================================
   패턴 선택
============================================================ */

function createPattern(){

    const t=game.elapsed;

    if(t<3){

        patternSingle();
        return;

    }

    if(t<7){

        const patterns=[
            patternSingle,
            patternLine,
            patternDiagonal
        ];

        patterns[
            Math.floor(
                Math.random()*patterns.length
            )
        ]();

        return;

    }

    if(t<12){

        const patterns=[
            patternLine,
            patternDiagonal,
            patternFan,
            patternOpposite
        ];

        patterns[
            Math.floor(
                Math.random()*patterns.length
            )
        ]();

        return;

    }

    const patterns=[
        patternSingle,
        patternLine,
        patternDiagonal,
        patternFan,
        patternOpposite
    ];

    patterns[
        Math.floor(
            Math.random()*patterns.length
        )
    ]();

}


/* ============================================================
   난이도
============================================================ */

function patternInterval(){

    if(game.elapsed<3){
        return .72;
    }

    if(game.elapsed<7){
        return .56;
    }

    if(game.elapsed<12){
        return .45;
    }

    if(game.elapsed<20){
        return .37;
    }

    return .31;

}


/* ============================================================
   시작
============================================================ */

function startGame(){

    game.running=true;

    game.elapsed=0;

    game.arrows=[];

    game.arrowTimer=.65;

    game.startTime=performance.now();

    game.lastTime=performance.now();

    player.reset();

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    requestAnimationFrame(loop);

}


/* ============================================================
   게임 오버
============================================================ */

function gameOver(){

    if(!game.running){
        return;
    }

    game.running=false;

    finalTime.textContent=
        game.elapsed.toFixed(2);

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* ============================================================
   업데이트
============================================================ */

function update(dt){

    game.elapsed=
        (
            performance.now()-
            game.startTime
        )/1000;

    player.update(dt);

    game.arrowTimer-=dt;

    if(game.arrowTimer<=0){

        createPattern();

        game.arrowTimer=
            patternInterval();

    }

    for(const arrow of game.arrows){

        arrow.update(dt);

        if(arrow.collides()){

            gameOver();
            return;

        }

        if(arrow.isOutside()){

            arrow.active=false;

        }

    }

    game.arrows=
        game.arrows.filter(
            arrow=>arrow.active
        );

}


/* ============================================================
   배경
============================================================ */

function drawBackground(){

    const w=canvas.width;
    const h=canvas.height;

    const bg=
        ctx.createLinearGradient(
            0,
            0,
            0,
            h
        );

    bg.addColorStop(
        0,
        "#020806"
    );

    bg.addColorStop(
        .5,
        "#092014"
    );

    bg.addColorStop(
        1,
        "#010402"
    );

    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    drawBamboo(
        80,
        .65,
        .35
    );


    /* CODE */

    ctx.save();

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font=
        "bold "+
        Math.min(
            w*.15,
            150
        )+
        "px Georgia";

    ctx.fillStyle=
        "rgba(220,185,75,.055)";

    ctx.shadowColor=
        "rgba(220,185,75,.15)";

    ctx.shadowBlur=35;

    ctx.fillText(
        "CODE",
        w/2,
        h/2
    );

    ctx.restore();


    drawBamboo(
        125,
        1,
        .65
    );


    const vignette=
        ctx.createRadialGradient(
            w/2,
            h/2,
            h*.2,
            w/2,
            h/2,
            w*.75
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.5)"
    );

    ctx.fillStyle=vignette;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );

}


function drawBamboo(
    spacing,
    scale,
    alpha
){

    for(
        let x=-60;
        x<canvas.width+100;
        x+=spacing
    ){

        const sway=
            Math.sin(x*.03)*8;

        const width=16*scale;

        const bamboo=
            ctx.createLinearGradient(
                x,
                0,
                x+width,
                0
            );

        bamboo.addColorStop(
            0,
            `rgba(4,20,9,${alpha})`
        );

        bamboo.addColorStop(
            .4,
            `rgba(45,85,42,${alpha})`
        );

        bamboo.addColorStop(
            .65,
            `rgba(60,105,52,${alpha})`
        );

        bamboo.addColorStop(
            1,
            `rgba(5,25,10,${alpha})`
        );

        ctx.fillStyle=bamboo;

        ctx.fillRect(
            x+sway,
            0,
            width,
            canvas.height
        );

        ctx.fillStyle=
            `rgba(4,18,7,${alpha})`;

        for(
            let y=50;
            y<canvas.height;
            y+=72
        ){

            ctx.fillRect(
                x+sway-2,
                y,
                width+4,
                5
            );

        }

    }

}


/* ============================================================
   렌더
============================================================ */

function draw(){

    drawBackground();

    for(const arrow of game.arrows){

        arrow.draw();

    }

    player.draw();

    timeText.textContent=
        game.elapsed.toFixed(2);

}


/* ============================================================
   루프
============================================================ */

function loop(now){

    if(!game.running){
        return;
    }

    const dt=
        Math.min(
            (now-game.lastTime)/1000,
            .05
        );

    game.lastTime=now;

    update(dt);

    draw();

    requestAnimationFrame(loop);

}


/* ============================================================
   버튼
============================================================ */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);


/* ============================================================
   초기
============================================================ */

player.reset();

draw();

</script>
