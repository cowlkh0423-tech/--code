<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CODE : 죽림고수</title>


    <style>

        /* =====================================================
           기본
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #020604;

        }


        body {

            font-family:
                Georgia,
                "Noto Serif KR",
                serif;

            color: #e4cd7b;

        }


        /* =====================================================
           게임 영역
        ===================================================== */

        #game {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }


        canvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

        }


        /* =====================================================
           HUD
        ===================================================== */

        #hud {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            padding:
                24px 28px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            pointer-events: none;

            z-index: 10;

        }


        #logo {

            font-size: 21px;

            letter-spacing: 7px;

            color:
                rgba(
                    225,
                    194,
                    100,
                    0.78
                );

        }


        #life {

            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            font-size: 27px;

            color:
                #e1c66d;

            text-shadow:
                0 0 15px
                rgba(
                    230,
                    190,
                    70,
                    0.8
                );

        }


        #timer {

            font-family:
                monospace;

            font-size: 19px;

            color:
                rgba(
                    235,
                    220,
                    170,
                    0.82
                );

        }


        /* =====================================================
           화면
        ===================================================== */

        .screen {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width:
                min(
                    520px,
                    88vw
                );

            padding:
                48px 35px;

            text-align: center;

            background:
                rgba(
                    3,
                    13,
                    7,
                    0.84
                );

            border:
                1px solid
                rgba(
                    220,
                    185,
                    90,
                    0.25
                );

            box-shadow:
                0 0 70px
                rgba(
                    0,
                    0,
                    0,
                    0.7
                );

            backdrop-filter:
                blur(12px);

            z-index: 20;

        }


        .hidden {

            display: none !important;

        }


        .subtitle {

            margin-bottom: 15px;

            font-size: 11px;

            letter-spacing: 5px;

            color:
                rgba(
                    220,
                    190,
                    110,
                    0.6
                );

        }


        .screen h1 {

            font-size:
                clamp(
                    62px,
                    13vw,
                    110px
                );

            letter-spacing: 15px;

            color:
                #dabb63;

            text-shadow:
                0 0 35px
                rgba(
                    220,
                    180,
                    70,
                    0.3
                );

        }


        .screen h2 {

            margin-top: 4px;

            font-size: 23px;

            font-weight: normal;

            letter-spacing: 8px;

        }


        .description {

            margin-top: 28px;

            line-height: 1.9;

            color:
                rgba(
                    235,
                    235,
                    215,
                    0.7
                );

        }


        .controls {

            margin-top: 23px;

            font-family:
                monospace;

            font-size: 12px;

            letter-spacing: 2px;

            color:
                rgba(
                    220,
                    195,
                    120,
                    0.7
                );

        }


        button {

            margin-top: 32px;

            padding:
                14px 36px;

            border:
                1px solid
                rgba(
                    220,
                    190,
                    100,
                    0.55
                );

            background:
                rgba(
                    190,
                    155,
                    60,
                    0.08
                );

            color:
                #e4c96f;

            font-family:
                Georgia,
                serif;

            font-size: 13px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        button:hover {

            background:
                rgba(
                    220,
                    180,
                    70,
                    0.18
                );

            box-shadow:
                0 0 25px
                rgba(
                    220,
                    180,
                    70,
                    0.2
                );

        }


        #finalTime {

            margin-top: 24px;

            font-family:
                monospace;

            font-size: 43px;

            color:
                #e3c76e;

        }


        #warning {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width: 180px;
            height: 180px;

            border:
                2px solid
                rgba(
                    225,
                    190,
                    75,
                    0.6
                );

            border-radius: 50%;

            opacity: 0;

            pointer-events: none;

            z-index: 8;

        }


        #warning.show {

            animation:
                warningPulse
                0.45s ease-out;

        }


        @keyframes warningPulse {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.45);

                opacity: 0.9;

            }

            100% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.5);

                opacity: 0;

            }

        }


    </style>

</head>


<body>


<div id="game">


    <canvas id="canvas"></canvas>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div id="hud">

        <div id="logo">
            CODE
        </div>


        <div id="life">
            ♥
        </div>


        <div id="timer">
            00.00
        </div>

    </div>


    <div id="warning"></div>


    <!-- =====================================================
         시작 화면
    ====================================================== -->

    <section
        id="startScreen"
        class="screen"
    >

        <div class="subtitle">
            BAMBOO SURVIVAL
        </div>


        <h1>
            CODE
        </h1>


        <h2>
            죽림고수
        </h2>


        <div class="description">

            쏟아지는 화살을 피해<br>

            최대한 오래 살아남아라.

        </div>


        <div class="controls">

            WASD / 방향키 이동

        </div>


        <button id="startButton">

            GAME START

        </button>

    </section>


    <!-- =====================================================
         게임 오버
    ====================================================== -->

    <section
        id="gameOverScreen"
        class="screen hidden"
    >

        <div class="subtitle">
            SURVIVAL ENDED
        </div>


        <h2>
            GAME OVER
        </h2>


        <div id="finalTime">
            00.00
        </div>


        <button id="restartButton">

            RESTART

        </button>


        <div class="controls">

            R 키로 재시작

        </div>

    </section>


</div>


<script>

"use strict";


/* ============================================================
   CANVAS
============================================================ */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* ============================================================
   UI
============================================================ */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const finalTimeElement =
    document.getElementById(
        "finalTime"
    );

const warningElement =
    document.getElementById(
        "warning"
    );


/* ============================================================
   게임 상태
============================================================ */

const game = {

    running: false,

    startTime: 0,

    lastTime: 0,

    time: 0,

    arrows: [],

    patterns: [],

    patternTimer: 0

};


/* ============================================================
   키보드
============================================================ */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        keys[key] = true;


        if (
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {

            event.preventDefault();

        }


        if (
            key === "r" &&
            !game.running
        ) {

            startGame();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = false;

    }
);


/* ============================================================
   화면 크기
============================================================ */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resize
);


resize();


/* ============================================================
   PLAYER
============================================================ */

const player = {

    x: 0,

    y: 0,

    radius: 15,

    speed: 340,

    alive: true,


    reset() {

        this.x =
            canvas.width / 2;

        this.y =
            canvas.height / 2;

        this.alive = true;

    },


    update(delta) {

        let dx = 0;

        let dy = 0;


        /* WASD */

        if (keys["w"]) {
            dy -= 1;
        }

        if (keys["s"]) {
            dy += 1;
        }

        if (keys["a"]) {
            dx -= 1;
        }

        if (keys["d"]) {
            dx += 1;
        }


        /* 방향키 */

        if (keys["arrowup"]) {
            dy -= 1;
        }

        if (keys["arrowdown"]) {
            dy += 1;
        }

        if (keys["arrowleft"]) {
            dx -= 1;
        }

        if (keys["arrowright"]) {
            dx += 1;
        }


        /* 대각선 속도 보정 */

        if (
            dx !== 0 ||
            dy !== 0
        ) {

            const length =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            dx /= length;

            dy /= length;

        }


        this.x +=
            dx *
            this.speed *
            delta;

        this.y +=
            dy *
            this.speed *
            delta;


        /* 화면 밖 방지 */

        this.x =
            Math.max(
                this.radius,
                Math.min(
                    canvas.width -
                    this.radius,
                    this.x
                )
            );


        this.y =
            Math.max(
                this.radius,
                Math.min(
                    canvas.height -
                    this.radius,
                    this.y
                )
            );

    },


    draw() {

        if (!this.alive) {
            return;
        }


        ctx.save();


        ctx.translate(
            this.x,
            this.y
        );


        /* 외부 빛 */

        ctx.shadowColor =
            "rgba(240,205,100,0.9)";

        ctx.shadowBlur = 22;


        /* 외곽 */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#dfc16a";

        ctx.fill();


        /* 내부 */

        ctx.shadowBlur = 0;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#0b1b0e";

        ctx.fill();


        /* 중심 */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            3.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#fff0a0";

        ctx.fill();


        ctx.restore();

    }

};


/* ============================================================
   ARROW
============================================================ */

class Arrow {

    constructor(
        x,
        y,
        angle,
        speed
    ) {

        this.x = x;

        this.y = y;

        this.angle = angle;

        this.speed = speed;

        this.active = true;

    }


    update(delta) {

        this.x +=
            Math.cos(
                this.angle
            ) *
            this.speed *
            delta;


        this.y +=
            Math.sin(
                this.angle
            ) *
            this.speed *
            delta;

    }


    outside() {

        const margin = 120;


        return (

            this.x <
                -margin ||

            this.x >
                canvas.width +
                margin ||

            this.y <
                -margin ||

            this.y >
                canvas.height +
                margin

        );

    }


    collision() {

        const dx =
            this.x -
            player.x;

        const dy =
            this.y -
            player.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        return (
            distance <
            player.radius +
            13
        );

    }


    draw() {

        ctx.save();


        ctx.translate(
            this.x,
            this.y
        );


        ctx.rotate(
            this.angle
        );


        /* =================================================
           잔상
        ================================================= */

        ctx.shadowColor =
            "rgba(235,195,75,0.9)";

        ctx.shadowBlur = 14;


        /* =================================================
           화살대
        ================================================= */

        const shaft =
            ctx.createLinearGradient(
                -24,
                0,
                20,
                0
            );


        shaft.addColorStop(
            0,
            "#71521f"
        );

        shaft.addColorStop(
            0.45,
            "#e3c46a"
        );

        shaft.addColorStop(
            1,
            "#9d7730"
        );


        ctx.fillStyle =
            shaft;


        ctx.fillRect(
            -23,
            -2.5,
            38,
            5
        );


        /* =================================================
           화살촉
        ================================================= */

        ctx.beginPath();

        ctx.moveTo(
            26,
            0
        );

        ctx.lineTo(
            10,
            -10
        );

        ctx.lineTo(
            13,
            0
        );

        ctx.lineTo(
            10,
            10
        );

        ctx.closePath();


        const head =
            ctx.createLinearGradient(
                8,
                -10,
                26,
                10
            );


        head.addColorStop(
            0,
            "#fff1aa"
        );

        head.addColorStop(
            0.5,
            "#e4c15a"
        );

        head.addColorStop(
            1,
            "#896421"
        );


        ctx.fillStyle =
            head;

        ctx.fill();


        /* =================================================
           깃털
        ================================================= */

        ctx.shadowBlur = 4;


        ctx.beginPath();

        ctx.moveTo(
            -22,
            0
        );

        ctx.lineTo(
            -34,
            -8
        );

        ctx.lineTo(
            -28,
            0
        );

        ctx.lineTo(
            -34,
            8
        );

        ctx.closePath();


        ctx.fillStyle =
            "#a8863a";

        ctx.fill();


        ctx.shadowBlur = 0;


        /* 하이라이트 */

        ctx.fillStyle =
            "rgba(255,245,190,0.8)";


        ctx.fillRect(
            -15,
            -1,
            25,
            2
        );


        ctx.restore();

    }

}


/* ============================================================
   화살 생성
============================================================ */

function addArrow(
    x,
    y,
    angle,
    speed
) {

    game.arrows.push(
        new Arrow(
            x,
            y,
            angle,
            speed
        )
    );

}


/* ============================================================
   랜덤 위치
============================================================ */

function randomSidePosition() {

    const side =
        Math.floor(
            Math.random() * 4
        );


    const margin = 80;


    if (side === 0) {

        return {

            x:
                Math.random() *
                canvas.width,

            y:
                -margin

        };

    }


    if (side === 1) {

        return {

            x:
                canvas.width +
                margin,

            y:
                Math.random() *
                canvas.height

        };

    }


    if (side === 2) {

        return {

            x:
                Math.random() *
                canvas.width,

            y:
                canvas.height +
                margin

        };

    }


    return {

        x:
            -margin,

        y:
            Math.random() *
            canvas.height

    };

}


/* ============================================================
   1. 직선 패턴
============================================================ */

function patternStraight() {

    const p =
        randomSidePosition();


    let angle;


    if (p.x < 0) {

        angle = 0;

    }

    else if (
        p.x >
        canvas.width
    ) {

        angle = Math.PI;

    }

    else if (p.y < 0) {

        angle =
            Math.PI / 2;

    }

    else {

        angle =
            -Math.PI / 2;

    }


    addArrow(
        p.x,
        p.y,
        angle,
        430 +
        game.time * 7
    );

}


/* ============================================================
   2. 양쪽
============================================================ */

function patternDouble() {

    const y =
        Math.random() *
        canvas.height;


    const speed =
        440 +
        game.time * 6;


    addArrow(
        -80,
        y,
        0,
        speed
    );


    addArrow(
        canvas.width + 80,
        y,
        Math.PI,
        speed
    );

}


/* ============================================================
   3. 대각선
============================================================ */

function patternDiagonal() {

    const margin = 80;

    const speed =
        450 +
        game.time * 6;


    const corner =
        Math.floor(
            Math.random() * 4
        );


    if (corner === 0) {

        addArrow(
            -margin,
            -margin,
            Math.PI / 4,
            speed
        );

    }


    else if (corner === 1) {

        addArrow(
            canvas.width + margin,
            -margin,
            3 * Math.PI / 4,
            speed
        );

    }


    else if (corner === 2) {

        addArrow(
            canvas.width + margin,
            canvas.height + margin,
            5 * Math.PI / 4,
            speed
        );

    }


    else {

        addArrow(
            -margin,
            canvas.height + margin,
            7 * Math.PI / 4,
            speed
        );

    }

}


/* ============================================================
   4. 부채꼴
============================================================ */

function patternFan(
    count = 7
) {

    const margin = 80;

    const side =
        Math.floor(
            Math.random() * 4
        );


    let x;

    let y;

    let baseAngle;


    if (side === 0) {

        x =
            Math.random() *
            canvas.width;

        y = -margin;

        baseAngle =
            Math.PI / 2;

    }


    else if (side === 1) {

        x =
            canvas.width +
            margin;

        y =
            Math.random() *
            canvas.height;

        baseAngle =
            Math.PI;

    }


    else if (side === 2) {

        x =
            Math.random() *
            canvas.width;

        y =
            canvas.height +
            margin;

        baseAngle =
            -Math.PI / 2;

    }


    else {

        x = -margin;

        y =
            Math.random() *
            canvas.height;

        baseAngle = 0;

    }


    const spread =
        Math.PI / 10;


    const speed =
        450 +
        game.time * 7;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            baseAngle +
            (
                i -
                (count - 1) / 2
            ) *
            spread;


        addArrow(
            x,
            y,
            angle,
            speed
        );

    }

}


/* ============================================================
   5. 플레이어 조준
============================================================ */

function patternAim() {

    const p =
        randomSidePosition();


    const dx =
        player.x -
        p.x;

    const dy =
        player.y -
        p.y;


    const angle =
        Math.atan2(
            dy,
            dx
        );


    addArrow(
        p.x,
        p.y,
        angle,
        510 +
        game.time * 7
    );

}


/* ============================================================
   6. 조준 3연발
============================================================ */

function patternAimTriple() {

    patternAim();


    setTimeout(
        function() {

            if (game.running) {

                patternAim();

            }

        },
        130
    );


    setTimeout(
        function() {

            if (game.running) {

                patternAim();

            }

        },
        260
    );

}


/* ============================================================
   7. 십자
============================================================ */

function patternCross() {

    const speed =
        480 +
        game.time * 6;


    addArrow(
        canvas.width / 2,
        -80,
        Math.PI / 2,
        speed
    );


    addArrow(
        canvas.width + 80,
        canvas.height / 2,
        Math.PI,
        speed
    );


    addArrow(
        canvas.width / 2,
        canvas.height + 80,
        -Math.PI / 2,
        speed
    );


    addArrow(
        -80,
        canvas.height / 2,
        0,
        speed
    );

}


/* ============================================================
   8. 원형
============================================================ */

function patternCircle() {

    const count = 12;


    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;


    const speed =
        360 +
        game.time * 4;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            Math.PI * 2 *
            i /
            count;


        addArrow(
            centerX,
            centerY,
            angle,
            speed
        );

    }

}


/* ============================================================
   9. 복합 패턴
============================================================ */

function patternCombination() {

    patternFan(7);


    setTimeout(
        function() {

            if (!game.running) {
                return;
            }

            patternDouble();

        },
        220
    );


    setTimeout(
        function() {

            if (!game.running) {
                return;
            }

            patternAimTriple();

        },
        440
    );

}


/* ============================================================
   경고 효과
============================================================ */

function warning() {

    warningElement.classList.remove(
        "show"
    );


    void warningElement.offsetWidth;


    warningElement.classList.add(
        "show"
    );

}


/* ============================================================
   패턴 선택
============================================================ */

function createPattern() {

    const t =
        game.time;


    /* --------------------------------------------------------
       0~3초
    -------------------------------------------------------- */

    if (t < 3) {

        patternStraight();

        return;

    }


    /* --------------------------------------------------------
       3~6초
    -------------------------------------------------------- */

    if (t < 6) {

        const patterns = [

            patternStraight,

            patternDouble,

            patternDiagonal

        ];


        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ]();


        return;

    }


    /* --------------------------------------------------------
       6~10초
    -------------------------------------------------------- */

    if (t < 10) {

        const patterns = [

            patternDouble,

            patternDiagonal,

            patternFan,

            patternAim

        ];


        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ]();


        return;

    }


    /* --------------------------------------------------------
       10초 이후
    -------------------------------------------------------- */

    const patterns = [

        patternDouble,

        patternFan,

        function() {
            patternFan(9);
        },

        patternAim,

        patternAimTriple,

        patternCross,

        patternCircle,

        patternCombination

    ];


    patterns[
        Math.floor(
            Math.random() *
            patterns.length
        )
    ]();

}


/* ============================================================
   난이도
============================================================ */

function getPatternInterval() {

    if (game.time < 3) {

        return 0.85;

    }


    if (game.time < 6) {

        return 0.65;

    }


    if (game.time < 10) {

        return 0.48;

    }


    if (game.time < 15) {

        return 0.36;

    }


    if (game.time < 20) {

        return 0.29;

    }


    return 0.23;

}


/* ============================================================
   게임 시작
============================================================ */

function startGame() {

    game.running = true;

    game.time = 0;

    game.arrows = [];

    game.patternTimer = 0.8;


    player.reset();


    game.startTime =
        performance.now();

    game.lastTime =
        performance.now();


    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );


    requestAnimationFrame(
        loop
    );

}


/* ============================================================
   게임 오버
============================================================ */

function gameOver() {

    if (!game.running) {
        return;
    }


    game.running = false;

    player.alive = false;


    finalTimeElement.textContent =
        game.time.toFixed(2);


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* ============================================================
   업데이트
============================================================ */

function update(delta) {

    /* 시간 */

    game.time =
        (
            performance.now() -
            game.startTime
        ) / 1000;


    /* 플레이어 */

    player.update(delta);


    /* 패턴 */

    game.patternTimer -= delta;


    if (
        game.patternTimer <= 0
    ) {

        warning();


        createPattern();


        game.patternTimer =
            getPatternInterval();

    }


    /* 화살 */

    for (
        const arrow of game.arrows
    ) {

        arrow.update(delta);


        /* 충돌 */

        if (
            arrow.collision()
        ) {

            arrow.active = false;

            gameOver();

            return;

        }


        /* 화면 밖 */

        if (
            arrow.outside()
        ) {

            arrow.active = false;

        }

    }


    /* 제거 */

    game.arrows =
        game.arrows.filter(
            function(arrow) {

                return arrow.active;

            }
        );

}


/* ============================================================
   대나무
============================================================ */

function drawBambooLayer(
    spacing,
    scale,
    opacity
) {

    const width =
        canvas.width;

    const height =
        canvas.height;


    for (
        let x = -50;
        x < width + 100;
        x += spacing
    ) {

        const sway =
            Math.sin(
                x * 0.04
            ) * 12;


        const bambooWidth =
            18 * scale;


        /* 줄기 */

        const gradient =
            ctx.createLinearGradient(
                x,
                0,
                x + bambooWidth,
                0
            );


        gradient.addColorStop(
            0,
            `rgba(5,22,10,${opacity})`
        );


        gradient.addColorStop(
            0.35,
            `rgba(40,82,43,${opacity})`
        );


        gradient.addColorStop(
            0.65,
            `rgba(56,105,53,${opacity})`
        );


        gradient.addColorStop(
            1,
            `rgba(8,29,13,${opacity})`
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            x + sway,
            0,
            bambooWidth,
            height
        );


        /* 마디 */

        ctx.fillStyle =
            `rgba(
                5,
                25,
                10,
                ${opacity}
            )`;


        for (
            let y = 45;
            y < height;
            y += 70
        ) {

            ctx.fillRect(
                x + sway - 2,
                y,
                bambooWidth + 4,
                6
            );

        }

    }

}


/* ============================================================
   배경
============================================================ */

function drawBackground() {

    const width =
        canvas.width;

    const height =
        canvas.height;


    /* 하늘 */

    const background =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    background.addColorStop(
        0,
        "#020806"
    );


    background.addColorStop(
        0.35,
        "#07170d"
    );


    background.addColorStop(
        0.7,
        "#0a2112"
    );


    background.addColorStop(
        1,
        "#010503"
    );


    ctx.fillStyle =
        background;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* 뒤쪽 대나무 */

    drawBambooLayer(
        70,
        0.65,
        0.42
    );


    /* 안개 */

    const fog =
        ctx.createRadialGradient(
            width / 2,
            height * 0.45,
            20,
            width / 2,
            height * 0.45,
            width * 0.72
        );


    fog.addColorStop(
        0,
        "rgba(150,180,105,0.10)"
    );


    fog.addColorStop(
        0.55,
        "rgba(80,120,70,0.035)"
    );


    fog.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        fog;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* CODE */

    ctx.save();


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        "bold " +
        Math.min(
            width * 0.15,
            155
        ) +
        "px Georgia";


    ctx.fillStyle =
        "rgba(225,190,80,0.065)";


    ctx.shadowColor =
        "rgba(225,190,80,0.22)";


    ctx.shadowBlur = 30;


    ctx.fillText(
        "CODE",
        width / 2,
        height / 2
    );


    ctx.restore();


    /* 앞쪽 대나무 */

    drawBambooLayer(
        105,
        1,
        0.68
    );


    /* 어두운 가장자리 */

    const vignette =
        ctx.createRadialGradient(
            width / 2,
            height / 2,
            height * 0.25,
            width / 2,
            height / 2,
            width * 0.75
        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    vignette.addColorStop(
        1,
        "rgba(0,0,0,0.48)"
    );


    ctx.fillStyle =
        vignette;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );

}


/* ============================================================
   그리기
============================================================ */

function draw() {

    drawBackground();


    /* 화살 */

    for (
        const arrow of game.arrows
    ) {

        arrow.draw();

    }


    /* 플레이어 */

    player.draw();


    /* 시간 */

    timerElement.textContent =
        game.time.toFixed(2);

}


/* ============================================================
   게임 루프
============================================================ */

function loop(currentTime) {

    if (!game.running) {
        return;
    }


    const delta =
        Math.min(
            (
                currentTime -
                game.lastTime
            ) / 1000,
            0.05
        );


    game.lastTime =
        currentTime;


    update(delta);

    draw();


    requestAnimationFrame(
        loop
    );

}


/* ============================================================
   버튼
============================================================ */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    startGame
);


/* ============================================================
   초기 화면
============================================================ */

drawBackground();

player.reset();

player.draw();

</script>
